# Pinned developer and CI tool versions — the single source of truth.
#
# `scripts/install-dev-tools.sh` installs exactly these versions locally, and
# `scripts/check-tool-pins.py` (part of `just check`) fails if a workflow or
# recipe declares a different one. CI keeps its versions written out
# literally, so a workflow still reads as a workflow; the check is what keeps
# the two honest. Bumping a tool means editing this file and the workflow
# together, in one commit, with the check proving they agree.
#
# `form` names how each pin is *declared*, so the checker reads the
# declaration rather than searching the file for a string. A comment naming
# the right version can never satisfy a check — only the command or action
# input that actually runs can. The forms are implemented in
# scripts/check-tool-pins.py:
#
#   install-action  `tool: <name>@<version>` passed to taiki-e/install-action
#   action-input    a `version:` input on a named, SHA-pinned action
#   none            not declared in any workflow; local tooling only
#
# Anything with a declaring form must actually be declared: a tool that
# disappears from the workflows fails the check rather than lingering here.

[cargo-llvm-cov]
version = "0.8.7"
form = "install-action"
# Coverage measurement. Pinned because coverage numbers are only comparable
# across runs of the same instrumentation.

[cargo-deny]
version = "0.20.2"
form = "install-action"

[cargo-auditable]
version = "0.7.5"
form = "install-action"
# Embeds the linked dependency list in released binaries so a shipped
# artifact can be audited directly rather than by trusting a side manifest.

[cargo-cyclonedx]
version = "0.5.9"
form = "install-action"
# Generates the per-target CycloneDX SBOM the release publishes beside each
# archive. Pinned as tightly as cargo-auditable and for the same reason: it
# describes a shipped artifact, so a bump changes what a consumer verifies.

[git-cliff]
version = "2.13.1"
form = "install-action"
# Generates the draft release notes from the Conventional Commit history.

[zizmor]
version = "1.28.0"
form = "action-input"
action = "zizmorcore/zizmor-action"

[codescene-cli]
version = "1.0.36"
form = "none"
build_sha = "5f703ce1f9c264701f32c795fa7104467f1e4ab4"
# sha256 of cs-linux-amd64-<build_sha>.zip, computed here on 2026-07-30 and
# verified at every install. CodeScene publishes no checksums of its own and
# keys download URLs by build SHA rather than by version, so the repository
# records both. Only linux-amd64 is recorded, so that is the only
# architecture the installer will fetch — an unrecorded architecture would
# mean installing an unverified binary.
sha256 = "b6a1b259c6b53d94d34c85b85bb725b6665973ab2bec9f6c678a371d7a0202ee"
# `form = "none"` because no workflow declares this tool: Code Health is a
# maintainer-local invariant, enforced by `just gate`, not a required check.
# scripts/install-dev-tools.sh reads the three values above at runtime, so
# there is no second copy for a checker to keep honest — the URL it builds
# and the checksum it verifies are these fields.
#
# `swept_at` is the CLI version the whole-repository 10.0 floor was last
# measured with, and it must equal `version`. CodeScene's rules change
# between CLI versions, so a bump can move a file below 10.0 without anyone
# touching that file; the delta the hooks run cannot see it, because no
# change touched it. Bumping the CLI therefore means running a full
# `just codescene` sweep and moving this line in the same commit — which is
# what re-establishes the baseline rather than inheriting a stale one.
swept_at = "1.0.36"

[cargo-semver-checks]
version = "0.49.0"
form = "none"
# Advisory until the first non-prerelease tag, so no workflow declares it;
# `just semver` and install-dev-tools.sh use this version.

[osv-scanner]
version = "2.4.0"
form = "none"
# CI runs OSV through Google's pinned reusable workflows, which carry their
# own scanner image; this version is the local `just osv` equivalent.

[lefthook]
version = "2.1.10"
form = "none"
# Runs the local git hooks. Purely a developer convenience: every rule it
# checks is re-checked in CI, so CI never installs it.

[rust]
# Every `toolchain:` input in a workflow and every `cargo +<toolchain>` in
# the justfile must name one of these three, and each must be used somewhere
# — a toolchain nobody runs is a pin that stopped meaning anything.
toolchain = "1.97.1"
msrv = "1.85.0"
coverage_nightly = "nightly-2026-07-30"
# Cargo.toml declares the MSRV at minor precision, the convention for
# `rust-version`, while the toolchain installed to test it needs the patch
# level. Both are recorded so each can be compared for equality; a prefix
# comparison would accept 1.85.1, or 1.8, just as readily.
msrv_manifest = "1.85"
