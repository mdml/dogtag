[package]
name = "dogtag-cli"
description = "Command-line interface for dogtag, the PKM SDK for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "dogtag"
path = "src/main.rs"
# The documented surface is the SDK, not the executable that consumes it.
# Without this, `cargo doc --workspace` emits a filename-collision warning:
# the `dogtag` binary and the `dogtag` library both claim doc/dogtag/
# (rust-lang/cargo#6313), and one silently overwrites the other.
doc = false

[dependencies]
dogtag = { workspace = true }
clap = { workspace = true }
