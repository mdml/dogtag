# .dogtag/contract.toml — the committed vault contract of the `dense` conformance fixture.
# `dense` stands for the PKM enthusiast with an established corpus: a mature taxonomy at realistic
# scale, of the kind that accretes over years. Its shape is derived from an established corpus as
# approximate counts; every name in it is authored fiction.
#
# The lifecycle axis is `standing`, and its ordinary state is the ABSENCE of a value: an unmarked
# note is simply live, and each named value marks a departure from that. The axis is therefore
# optional on every type that declares it, which is spelled out rather than defaulted.
#
# Two of the nine property kinds go unreached here, and that is the corpus speaking rather than an
# omission: money is recorded in minor units as an integer, and this corpus dates things by the day.
#
# Version 2 (M3): the [tags] table names `tags` as the corpus's tag property; four tag namespaces
# are declared on the types that schematize their tagging; and the record kind carries the labeled
# multi-value channel on `person`. The catch-all relaxes its formerly-required properties, because
# a version-2 catch-all may require nothing.

contract_version = 2

[dialect]
links = "wikilink"

[lifecycle]
axis = "standing"
ordinary = { absent = true }

# The corpus's word for tags. The named property is declared `list` of `string` on every type
# that declares a namespace; namespaces themselves are per-type, below.

[tags]
property = "tags"

# Flags are boolean properties, orthogonal to the axis above.

[[flag]]
property = "needs_rework"

[[flag]]
property = "verified"

[[flag]]
property = "confidential"

# The notes the corpus is about. Six kinds of referent, six identity-bearing
# types: nothing here is a privileged entity with impostors beside it.

[[type]]
name = "person"
capabilities = ["identity-bearing"]

  [[type.property]]
  name = "title"
  kind = "string"
  required = true

  [[type.property]]
  name = "summary"
  kind = "string"

  [[type.property]]
  name = "aliases"
  kind = "list"
  of = "string"

  [[type.property]]
  name = "sort_name"
  kind = "string"

  [[type.property]]
  name = "first_met"
  kind = "date"

  [[type.property]]
  name = "verified"
  kind = "boolean"

  [[type.property]]
  name = "tags"
  kind = "list"
  of = "string"

  [[type.property]]
  name = "standing"
  kind = "enum"
  values = ["paused", "blocked", "supplanted", "retired"]
  required = false

  [[type.property]]
  name = "created"
  kind = "date"
  required = true

  [[type.property]]
  name = "updated"
  kind = "date"

  [[type.property]]
  name = "review_after"
  kind = "date"

  # Version 2: the labeled multi-value channel — how a person is reached, one
  # labeled entry per channel — and the single record of the last time they were.

  [[type.property]]
  name = "handles"
  kind = "list"
  of = "record"

    [[type.property.field]]
    name = "channel"
    kind = "enum"
    values = ["mail", "phone", "web", "chat"]
    required = true

    [[type.property.field]]
    name = "value"
    kind = "string"
    required = true

    [[type.property.field]]
    name = "preferred"
    kind = "boolean"

  [[type.property]]
  name = "last_reached"
  kind = "record"

    [[type.property.field]]
    name = "reached_on"
    kind = "date"
    required = true

    [[type.property.field]]
    name = "via"
    kind = "string"

  [[type.tag-namespace]]
  prefix = "circle/"
  open = true

  [[type.relationship]]
  predicate = "employed-by"

  [[type.relationship]]
  predicate = "located-in"

  [[type.relationship]]
  predicate = "mentions"

