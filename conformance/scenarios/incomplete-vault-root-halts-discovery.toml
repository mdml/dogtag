id = "incomplete-vault-root-halts-discovery"
title = "A vault root missing its committed contract halts discovery instead of delegating upward"
milestone = "M2"
status = "pending"
contract = """
Given a vault whose root holds the committed contract, and beneath it a
directory carrying the marker of a vault root but no committed contract.

When discovery runs from the incomplete directory.

Then discovery halts there with a diagnostic naming that directory, rather
than continuing upward to the enclosing vault. A partially configured vault
is reported as damaged, never resolved silently to a different corpus: an
operation that reports success against a corpus the caller did not name is
the failure this rule exists to prevent.
"""
