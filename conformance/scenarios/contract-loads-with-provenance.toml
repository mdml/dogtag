id = "contract-loads-with-provenance"
title = "A committed contract loads with per-setting provenance"
milestone = "M2"
status = "executable"
contract = """
Given a vault whose committed contract declares its types, properties,
relationships, capabilities, lifecycle declaration, and write policy, and a
machine-local installation record alongside it.

When the configuration is loaded.

Then loading succeeds, the resolved configuration exposes every declared
setting, and each resolved value carries its provenance — which source
supplied it: the committed contract, the machine-local installation record for
the settings that record owns, or the format default fixed by the version the
contract declares — so a caller can ask where any effective value came from,
and can tell a value the author chose from one nobody stated.
"""
