id = "contract-loads-with-provenance"
title = "A committed contract loads with per-setting provenance"
milestone = "M2"
status = "pending"
contract = """
Given a vault whose committed contract declares its types, properties,
relationships, capabilities, lifecycle axis, and write policy.

When the contract is loaded.

Then loading succeeds, the resolved contract exposes every declared setting,
and each resolved setting carries its provenance — which source supplied it:
the committed contract, an initialization default, or the local installation
record — so a caller can ask where any effective setting came from.
"""
