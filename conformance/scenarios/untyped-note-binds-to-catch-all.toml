id = "untyped-note-binds-to-catch-all"
title = "A note without a discriminator is a member of the catch-all"
milestone = "M3"
status = "executable"
contract = """
Given a corpus containing a note with no type discriminator, and a contract
declaring exactly one catch-all type.

When the corpus is read and the note is shown.

Then the note is a member of the catch-all and the document model says so:
the binding names the catch-all type and reports that it bound by catch-all
rather than by declaration. Unclassified capture is a first-class member of
the corpus, not an error and not an absence.
"""
