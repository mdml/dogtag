id = "contract-explain-renders-every-declaration"
title = "The explained contract carries every declaration, in both renderings"
milestone = "M2"
status = "pending"
contract = """
Given a vault whose committed contract loads, carrying its declared types and
their capabilities, each type's properties with their value kinds and whether
each is required, its relationship predicates and their requirements, its
lifecycle declaration, its write policy, and its dialect.

When the resolved contract is explained, both as instructions written for an
agent to follow and as a structured document.

Then every declaration present in the contract appears in both renderings,
and neither carries a declaration the contract does not make. The two agree
with each other, so an agent reading the instructions and a program reading
the structured document receive the same vault. Every value in the structured
rendering names the source that supplied it. The rendering names no concept
the contract did not declare, whatever the corpus's taxonomy, dialect, or
lifecycle encoding — including a corpus that declares it has no lifecycle
axis, which is rendered as the statement it is rather than as an omission.
"""
