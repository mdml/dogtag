id = "unsupported-contract-version-refuses-with-diagnosis"
title = "An unsupported contract version refuses the operation while diagnosis still runs"
milestone = "M2"
status = "executable"
contract = """
Given a vault whose committed contract declares a format version above the
range the tool supports, and separately one declaring a version below that
range.

When the vault is diagnosed, and when an operation requiring the resolved
contract is attempted.

Then the operation is refused in both cases, with distinct stable diagnostic
identifiers for a version that is too new and one that is below the supported
floor, each naming the version found and the range supported. The refusal is
the version's, not the parser's: an out-of-range contract yields exactly that
one diagnostic rather than a series of complaints about keys the tool does not
recognize. Diagnosis still produces a report — the resolved root, the local
installation state, and the version classification are all reported, and every
part depending on the contract is marked as not evaluated together with the
reason.
"""
