id = "dangling-typed-link-diagnostic"
title = "A dangling typed link yields a stable diagnostic against the reference"
milestone = "M3"
status = "executable"
contract = """
Given a corpus that conforms except for one note carrying a directed, typed
relationship whose target resolves to no note in the corpus.

When the corpus is validated.

Then validation reports one diagnostic with a stable identifier addressed to
the dangling reference itself — not to the missing target and not to the
corpus — and the rest of the corpus still validates cleanly.
"""
