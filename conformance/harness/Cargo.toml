# Conformance harness. Never published: it exists to keep the SDK honest,
# not to be consumed. See ../README.md for the no-waiver rule this crate's
# structure enforces.

[package]
name = "dogtag-conformance"
description = "Dogtag conformance harness: every scenario against every fixture profile, no waivers"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# The harness consumes the SDK's **public API only**. It is therefore also a
# permanent test that the public API is sufficient: any private hook the
# harness turns out to need is an architecture bug in the SDK, never a reason
# to widen its visibility or to reimplement a kernel rule here.
[dependencies]
dogtag = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
