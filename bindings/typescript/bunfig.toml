# Package quarantine: new dependency versions must be at least seven days
# old at resolution time (supply-chain compromise window). Applies to direct
# and transitive resolution; versions already in bun.lock are unaffected.
# An urgent younger security release is handled by a one-off
# `bun add <pkg>@<version> --minimum-release-age 0` recorded in
# security-exceptions.toml — never by a standing exclusion below.
[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = []
