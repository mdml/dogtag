# Coverage ratchet baseline. CI fails if measured coverage falls below these
# values or below the hard thresholds (95% line / 90% branch global; 100%
# line for every file under the kernel paths). Raising values is routine;
# lowering them requires an ADR (see docs/decisions/engineering/). The
# toolchain pin exists because branch coverage requires nightly
# instrumentation.
toolchain = "nightly-2026-07-30"

[global]
# Measured on the pinned toolchain: 99.3365% lines and 98.7342% branches.
# Recorded floored to two decimals, so the ratchet compares against a number a
# clean run reproduces rather than one that rounds up past it.
#
# Both numbers rose at M2, which is the milestone that gives [kernel] below
# something to measure: crates/dogtag/src/ stops being a version string and
# every file under it is at 100% line. The residue is the conformance
# harness's own failure-reporting arms and one branch in tools/commit-lint.
#
# Branch coverage moved down once before, from 98.07 to 97.72, when
# tools/commit-lint joined the workspace — a larger denominator, not an
# erosion of what was already covered. Lowering this number is the one move
# the ratchet does not allow silently; that one is recorded in
# docs/decisions/engineering/2026-07-30-commit-convention-and-release-notes.md.
#
# Both rose again when the contract's per-version schema landed at M3: the new
# module is data plus one small lookup, all of it reached from tests, so it
# raises the covered fraction rather than merely enlarging the denominator.
# They rose once more with the tag vocabulary, for the same reason: the walk,
# the model and both renderings are reached from tests exhaustively, so the new
# lines are covered lines. The version-2 catch-all rule raised them again: it
# is one branch per requirement kind and one per version, and every arm — each
# kind of requirement, several at once, none at all, and the same contract at
# version 1 — is reached from a named test. The record kind raised them once
# more, for the same reason each of the others did: a walk, a model, two
# renderings and three equivalence readers, every arm of which — both record
# spellings, every field kind, each refusal, and the same bytes read at version
# 1 — is reached from a named test.
#
# The corpus traversal raised them again. Membership is a handful of small
# predicates and one walk, and every arm of it — a note in a folder, a file that
# is not Markdown, a dotted directory, a dotted file, a symlink, an empty vault,
# and a directory that cannot be read at all — is reached from a named test.
#
# The document model raised them furthest. It is the largest thing this kernel
# has grown at once — a traversal, a frontmatter subset, the lexical forms, the
# binding, and the note-side rules — and every refusal in it is reached from a
# named test, including the ones a note only meets by accident: a tab in the
# indentation, an alias, a duplicate key, a shape nested past what the subset
# reads, a leap day, and a byte order mark on a file with carriage returns.
# Link resolution raised the line number once more and the branch number a
# little. The name index, the two dialects' grammars and the resolution pass are
# small and wholly reached from tests — a bare name that one note bears and that
# two bear, a path-qualified reference with and without its extension, a
# reference each dialect does and does not spell, a body reference that resolves
# and one that does not, and a caller's reference that names nothing.
#
# The wikilink alias and anchor moved both numbers up a hundredth. The two
# splits are a few lines in the link grammar plus one self-reference branch in
# resolution, and every shape — an alias with and without display text, a
# fragment empty and nonempty, the empty target that names the containing note,
# and the wholly empty reference that still dangles — is reached from a named
# test.
#
# The adjudicated review repairs moved both numbers up another hundredth.
# Code-block-aware link extraction, the innermost-run link spans, universal
# newlines in frontmatter, the spaced quoted key, the located directory
# diagnostic, and the traversal's honest answer for a name that is not valid
# UTF-8 are each a few lines, and every one is reached from a named test.
#
# Corpus listing and the shared `show` report landed together and raised both
# numbers. Listing's body-free read path, four composable filters, both
# ordinary-state encodings, the no-axis refusal, and both of its renderings;
# show's property-value shapes, binding absences, relationship edges,
# caller-reference outcomes, and rendering/refusal routes — each is reached
# from a named SDK or CLI test.
#
# The corpus health check raised both numbers again. Its aggregate — the
# total-order merge, the per-severity and per-identifier tallies, and both
# renderings including the no-findings answer — is reached from named SDK and
# CLI tests, and the shared CLI preflight it extracted carries no branches of
# its own. The branch floor sits one hundredth under the measurement because
# the instrumented branch count varies by one across runs and the measured
# 99.30 straddles the boundary; 99.29 is the highest floor every run clears.
#
# Adjudicated 2026-08-04, with the M3 scenario graduation: the global floors
# move DOWN once, to the measurement, because the fourteen graduated cases
# and the corpus-derivation machinery add ~1,900 harness lines whose
# remaining uncovered arms are assertion-failure messages — text that
# executes only when the product under test misbehaves, which a passing
# conformance suite cannot make happen. Every honestly reachable failure
# path is tested; the kernel floor below is untouched and every kernel file
# holds 100%. This is dilution by test infrastructure, not eroded product
# coverage, and the ratchet resumes rising from here.
#
# The M4 retrieval surfaces raised both numbers: the search scan, the query
# grammar, the tokenizer, the find lookup, and every rendering land fully
# covered — every line and every branch of the new kernel modules is reached
# from a named SDK or CLI test — so the workspace total rose with them to a
# measured 99.07 / 98.72.
#
# PROPOSED FOR ADJUDICATION with the M4 scenario graduation, on the
# 2026-08-04 entry's precedent: the line floor moves DOWN to the measurement
# because the eight graduated retrieval cases add harness lines whose
# remaining uncovered arms are assertion-failure details — text that executes
# only when the product under test misbehaves, which a passing conformance
# suite cannot make happen. Unlike the M3 wave, those details are themselves
# built by functions whose text IS tested; what stays uncovered is the
# closure plumbing and the filesystem-failure `?` arms. Every honestly
# reachable refusal branch is tested, the kernel floor below is untouched,
# every kernel file holds 100%, and the branch floor RISES. This is dilution
# by test infrastructure, not eroded product coverage; the ratchet resumes
# rising from here. The measurement is the integrated one — the graduated
# cases running on all three built corpora, docs included — and both floors
# sit one hundredth under it: 98.99 / 98.94.
#
# PROPOSED FOR ADJUDICATION with the graduation of the four docs-native M4
# scenarios, on the same 2026-08-04 precedent and for the same reason a third
# time: the four new harness cases add ~380 lines whose remaining uncovered
# arms are the `?` that propagates a failed assertion and the closures that
# build a failure detail — both of which execute only when the product under
# test misbehaves, which a passing conformance suite cannot make happen. The
# detail text itself is tested, function by function, in the module's own
# `the_details_a_misbehaving_sdk_would_earn_say_what_went_wrong`; what stays
# uncovered is the plumbing around it. Every honestly reachable refusal
# branch is tested — a corpus that is not clean, a committed bearer of the
# planted name, a committed needle, a contract carrying no catch-all, and
# both link dialects — the kernel floor below is untouched, and every kernel
# file still holds 100%.
#
# This entry lowers the BRANCH floor as well as the line floor, which the
# 2026-08-04 precedent does not itself cover: that adjudication moved the
# global floors down together, but the M4 surfaces wave above moved branch
# up, and this wave moves it down again by the same dilution. Flagged rather
# than folded in silently.
#
# Measured on the pinned toolchain, integrated (the thirty-six scenarios
# against all three built corpora): 98.84 lines and 98.83 branches, against
# 98.99 / 98.94 measured on the commit this branched from. Both floors sit
# one hundredth under the measurement: 98.83 / 98.82.
#
# Contract version 3 raised the branch number and held the line number. This is
# an ordinary ratchet raise, not an adjudication: no floor moves down. The new
# kernel module is a walk, a model and two renderings, every arm of which — a
# version with no write seat and a version with one, a declared directory and a
# defaulted one, each way a directory leaves the visible corpus, a declared
# birth state and an undeclared one, a repeated birth flag, and both halves of
# the cross-contract rule — is reached from a named test, so the new lines are
# covered lines and the new branches are covered branches.
#
# Two claims that had quietly stopped being tested were restored rather than
# left as dilution, which is where most of the branch rise comes from. Holding
# `dense` and `docs` at version 2 put every built corpus on one side or the
# other of the `supported`-but-not-current classification, so
# `supported-contract-version-loads-with-info` gained a committed-evidence arm
# and a guard arm and lost the arm nothing witnessed; and `starter` gaining the
# triage flag it is born carrying left the *no flags* rendering witnessed by no
# profile, so that claim is now derived — every profile is stripped of its
# flags and asserted against — rather than read off whichever profile happens
# to declare none.
#
# Measured on the pinned toolchain, integrated: 98.8449 lines and 98.8753
# branches, against 98.8404 / 98.8323 on the commit this branched from. Floors
# one hundredth under, as above: 98.83 (unmoved) / 98.86.
#
# The write transaction raised both again, and again as an ordinary ratchet
# raise rather than an adjudication. The new module is the plan, the identity a
# capture takes, the bytes it writes, the commit seam, and the transaction that
# composes them, and every arm of each is reached from a named test — a preview
# and an act, a declared capture directory and a defaulted one, a birth state
# and none, a collision and the bound that stops one, an ownership refusal, a
# directory that cannot be made and a note that cannot be written, a target
# that leaves the vault through a link, an unattributed act, a repository that
# commits and a repository whose hook refuses.
#
# Three refusals that no test could reach were **removed rather than left
# uncovered**, which is the rule the kernel floor exists to enforce: a
# catch-all that a resolved contract cannot lack, a canonicalization failure
# that the containment check already answers for, and a created file with no
# vault-relative spelling — the last by making the containment check
# per-candidate, so obtaining the spelling and proving the target is inside the
# root became one act instead of two.
#
# Measured on the pinned toolchain, integrated: 98.92 lines and 98.93
# branches. Floors one hundredth under: 98.91 / 98.92.
#
# The `capture` surface held both numbers. A thin consumer adds few lines of
# its own, and every arm of the ones it adds is reached from a test against the
# built binary: each of the three inputs, a thought that is not text at all, a
# preview against a byte-identical tree, the record's actor and the
# invocation's, all three capacities, a selector naming no vault, an unresolved
# contract, and a corpus error that reports and does not change the verdict.
#
# Measured on the pinned toolchain, integrated: 98.92 lines and 98.94
# branches. Floors one hundredth under: 98.91 (unmoved) / 98.93.
#
# RATIFIED by the maintainer 2026-08-08, with the M5 scenario graduation, on the 2026-08-04
# entry's precedent and for the same reason a fourth time: BOTH global floors
# move DOWN to the measurement, because the ten graduated write cases add
# ~390 harness lines whose remaining uncovered arms are the `?` that
# propagates a failed assertion and the closures that build a failure detail
# — text that executes only when the product under test misbehaves, which a
# passing conformance suite cannot make happen.
#
# What was covered rather than conceded, so the concession is only what is
# left: the module carries its own
# `the_details_a_misbehaving_sdk_would_earn_say_what_went_wrong`, which runs
# **every one of the ten cases** against a corpus whose catch-all refuses
# every write and requires each to say what happened — so a case added
# without a legible refusal fails there rather than diluting silently — plus
# named tests for each shared helper's detail: a result that created nothing,
# an act that did not land, a path the corpus does not hold, and a note
# stamped with the wrong flags. What stays uncovered is the detail a case
# would build at a *later* stage than the one that fails first, which would
# need an SDK misbehaving differently for each assertion in turn.
#
# The kernel floor below is untouched and every kernel file still holds 100%,
# including the whole write transaction: this is dilution by test
# infrastructure, not eroded product coverage, and the ratchet resumes rising
# from here.
#
# Measured on the pinned toolchain, integrated (the forty-six scenarios
# against all three built corpora): 98.6115 lines and 98.6667 branches,
# against 98.92 / 98.94 on the commit this branched from. Both floors sit one
# hundredth under the measurement: 98.60 / 98.65.
line = 98.60
branch = 98.65

[thresholds]
line = 95.0
branch = 90.0

[kernel]
# Public semantic-kernel/domain/configuration modules: 100% line coverage.
paths = ["crates/dogtag/src/"]
line = 100.0
