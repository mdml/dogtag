# Coverage ratchet baseline. CI fails if measured coverage falls below these
# values or below the hard thresholds (95% line / 90% branch global; 100%
# line for every file under the kernel paths). Raising values is routine;
# lowering them requires an ADR (see docs/decisions/engineering/). The
# toolchain pin exists because branch coverage requires nightly
# instrumentation.
toolchain = "nightly-2026-07-30"

[global]
# Measured on the pinned toolchain: 99.3365% lines and 98.7342% branches.
# Recorded floored to two decimals, so the ratchet compares against a number a
# clean run reproduces rather than one that rounds up past it.
#
# Both numbers rose at M2, which is the milestone that gives [kernel] below
# something to measure: crates/dogtag/src/ stops being a version string and
# every file under it is at 100% line. The residue is the conformance
# harness's own failure-reporting arms and one branch in tools/commit-lint.
#
# Branch coverage moved down once before, from 98.07 to 97.72, when
# tools/commit-lint joined the workspace — a larger denominator, not an
# erosion of what was already covered. Lowering this number is the one move
# the ratchet does not allow silently; that one is recorded in
# docs/decisions/engineering/2026-07-30-commit-convention-and-release-notes.md.
#
# Both rose again when the contract's per-version schema landed at M3: the new
# module is data plus one small lookup, all of it reached from tests, so it
# raises the covered fraction rather than merely enlarging the denominator.
# They rose once more with the tag vocabulary, for the same reason: the walk,
# the model and both renderings are reached from tests exhaustively, so the new
# lines are covered lines. The version-2 catch-all rule raised them again: it
# is one branch per requirement kind and one per version, and every arm — each
# kind of requirement, several at once, none at all, and the same contract at
# version 1 — is reached from a named test.
line = 99.33
branch = 98.73

[thresholds]
line = 95.0
branch = 90.0

[kernel]
# Public semantic-kernel/domain/configuration modules: 100% line coverage.
paths = ["crates/dogtag/src/"]
line = 100.0
