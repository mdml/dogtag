# Coverage ratchet baseline. CI fails if measured coverage falls below these
# values or below the hard thresholds (95% line / 90% branch global; 100%
# line for every file under the kernel paths). Raising values is routine;
# lowering them requires an ADR (see docs/decisions/engineering/). The
# toolchain pin exists because branch coverage requires nightly
# instrumentation.
toolchain = "nightly-2026-07-30"

[global]
# Measured on the pinned toolchain: 99.3365% lines and 98.7342% branches.
# Recorded floored to two decimals, so the ratchet compares against a number a
# clean run reproduces rather than one that rounds up past it.
#
# Both numbers rose at M2, which is the milestone that gives [kernel] below
# something to measure: crates/dogtag/src/ stops being a version string and
# every file under it is at 100% line. The residue is the conformance
# harness's own failure-reporting arms and one branch in tools/commit-lint.
#
# Branch coverage moved down once before, from 98.07 to 97.72, when
# tools/commit-lint joined the workspace — a larger denominator, not an
# erosion of what was already covered. Lowering this number is the one move
# the ratchet does not allow silently; that one is recorded in
# docs/decisions/engineering/2026-07-30-commit-convention-and-release-notes.md.
#
# Both rose again when the contract's per-version schema landed at M3: the new
# module is data plus one small lookup, all of it reached from tests, so it
# raises the covered fraction rather than merely enlarging the denominator.
# They rose once more with the tag vocabulary, for the same reason: the walk,
# the model and both renderings are reached from tests exhaustively, so the new
# lines are covered lines. The version-2 catch-all rule raised them again: it
# is one branch per requirement kind and one per version, and every arm — each
# kind of requirement, several at once, none at all, and the same contract at
# version 1 — is reached from a named test. The record kind raised them once
# more, for the same reason each of the others did: a walk, a model, two
# renderings and three equivalence readers, every arm of which — both record
# spellings, every field kind, each refusal, and the same bytes read at version
# 1 — is reached from a named test.
#
# The corpus traversal raised them again. Membership is a handful of small
# predicates and one walk, and every arm of it — a note in a folder, a file that
# is not Markdown, a dotted directory, a dotted file, a symlink, an empty vault,
# and a directory that cannot be read at all — is reached from a named test.
#
# The document model raised them furthest. It is the largest thing this kernel
# has grown at once — a traversal, a frontmatter subset, the lexical forms, the
# binding, and the note-side rules — and every refusal in it is reached from a
# named test, including the ones a note only meets by accident: a tab in the
# indentation, an alias, a duplicate key, a shape nested past what the subset
# reads, a leap day, and a byte order mark on a file with carriage returns.
# Link resolution raised the line number once more and the branch number a
# little. The name index, the two dialects' grammars and the resolution pass are
# small and wholly reached from tests — a bare name that one note bears and that
# two bear, a path-qualified reference with and without its extension, a
# reference each dialect does and does not spell, a body reference that resolves
# and one that does not, and a caller's reference that names nothing.
#
# The wikilink alias and anchor moved both numbers up a hundredth. The two
# splits are a few lines in the link grammar plus one self-reference branch in
# resolution, and every shape — an alias with and without display text, a
# fragment empty and nonempty, the empty target that names the containing note,
# and the wholly empty reference that still dangles — is reached from a named
# test.
#
# The adjudicated review repairs moved both numbers up another hundredth.
# Code-block-aware link extraction, the innermost-run link spans, universal
# newlines in frontmatter, the spaced quoted key, the located directory
# diagnostic, and the traversal's honest answer for a name that is not valid
# UTF-8 are each a few lines, and every one is reached from a named test.
line = 99.53
branch = 99.26

[thresholds]
line = 95.0
branch = 90.0

[kernel]
# Public semantic-kernel/domain/configuration modules: 100% line coverage.
paths = ["crates/dogtag/src/"]
line = 100.0
