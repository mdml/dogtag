name: Release

# Pushing a tag `v[0-9]*` builds release artifacts for all supported targets and
# assembles a DRAFT prerelease. Publishing the draft is always a human act.

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p dogtag-cli --target ${{ matrix.target }}
      - name: Package
        run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogtag-${{ matrix.target }}
          path: |
            dist/dogtag-${{ matrix.target }}.tar.gz
            dist/dogtag-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches workspace version
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "error: could not parse version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match workspace version $version (expected v$version)" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches workspace version $version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums and build aggregate sha256.sum
        working-directory: dist
        run: |
          for sidecar in *.tar.gz.sha256; do
            sha256sum -c "$sidecar"
          done
          cat -- *.tar.gz.sha256 | LC_ALL=C sort -k 2 > sha256.sum
          echo "aggregate sha256.sum:"
          cat sha256.sum
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "dogtag $TAG" \
            --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/sha256.sum
