name: Release

# Pushing a tag `v[0-9]*` builds release artifacts for all supported targets and
# assembles a DRAFT prerelease. Publishing the draft is always a human act.

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

# A release must never be cancelled midway: half a matrix leaves a draft with
# missing artifacts, which is worse than a slow queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    # Release artifacts are built only in the canonical repository. A fork
    # that pushes a v* tag builds nothing, so no fork can produce something
    # that looks like an official release.
    if: github.repository == 'mdml/dogtag'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-auditable@0.7.5
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-cyclonedx@0.5.9
      # The target reaches the shell through the environment rather than
      # through template expansion: nothing in the release path interpolates
      # a workflow expression into a command line, so there is no expansion
      # to audit if a matrix value ever stops being a literal.
      #
      # `cargo auditable` embeds the exact linked dependency list in the
      # binary (a ~370-byte .dep-v0 section), so a shipped artifact can be
      # audited directly with `cargo audit bin` without trusting a separate
      # manifest to describe it. It is deterministic — verified byte-identical
      # across rebuilds — so it does not disturb archive reproducibility.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --release --locked -p dogtag-cli --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/package.sh "$TARGET"
      # The SBOM is generated here, in the matrix, because it is per-binary
      # and per-target: this is the only job that knows which target it is
      # describing. The attestation that binds it to the archive is minted in
      # the release job, which is the only job holding those permissions.
      - name: SBOM
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/sbom.sh "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogtag-${{ matrix.target }}
          path: |
            dist/dogtag-${{ matrix.target }}.tar.gz
            dist/dogtag-${{ matrix.target }}.tar.gz.sha256
            dist/dogtag-${{ matrix.target }}.cdx.json
            dist/dogtag-${{ matrix.target }}.cdx.json.sha256
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # OIDC identity for provenance signing
      attestations: write # record the build-provenance and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git-cliff reads the tag range to build the notes
      - name: Verify tag matches workspace version
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "error: could not parse version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match workspace version $version (expected v$version)" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches workspace version $version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums and build aggregate sha256.sum
        working-directory: dist
        run: |
          # Every sidecar, not just the archives': the SBOM is a published
          # asset too, and the aggregate is documented as the one file that
          # checks everything. An asset the aggregate skips is an asset a
          # mirror ships unchecked.
          for sidecar in *.sha256; do
            sha256sum -c "$sidecar"
          done
          cat -- *.sha256 | LC_ALL=C sort -k 2 > sha256.sum
          echo "aggregate sha256.sum:"
          cat sha256.sum
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
      # One SBOM attestation per target: the subject is that target's archive
      # and the predicate is that target's SBOM, so the two cannot be mixed up
      # by a glob — an SBOM attached to the wrong archive would describe a
      # dependency closure that binary does not have. `actions/attest` carries
      # exactly one predicate per call, which is why four archives are four
      # steps. `actions/attest-sbom` is deliberately not used: upstream
      # deprecated it in favour of this general action.
      #
      # Verifying one of these needs `--predicate-type
      # https://cyclonedx.org/bom` explicitly, because `gh attestation verify`
      # defaults to the SLSA provenance predicate and would otherwise report
      # success having never looked at the SBOM.
      - name: Attest SBOM (x86_64-unknown-linux-musl)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/dogtag-x86_64-unknown-linux-musl.tar.gz
          predicate-type: https://cyclonedx.org/bom
          predicate-path: dist/dogtag-x86_64-unknown-linux-musl.cdx.json
      - name: Attest SBOM (aarch64-unknown-linux-musl)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/dogtag-aarch64-unknown-linux-musl.tar.gz
          predicate-type: https://cyclonedx.org/bom
          predicate-path: dist/dogtag-aarch64-unknown-linux-musl.cdx.json
      - name: Attest SBOM (aarch64-apple-darwin)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/dogtag-aarch64-apple-darwin.tar.gz
          predicate-type: https://cyclonedx.org/bom
          predicate-path: dist/dogtag-aarch64-apple-darwin.cdx.json
      - name: Attest SBOM (x86_64-apple-darwin)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/dogtag-x86_64-apple-darwin.tar.gz
          predicate-type: https://cyclonedx.org/bom
          predicate-path: dist/dogtag-x86_64-apple-darwin.cdx.json
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: git-cliff@2.13.1
      # Deterministic notes from the Conventional Commit history, replacing
      # `--generate-notes` (a flat list of pull-request titles). The commit
      # types are enforced on the way in, so the grouping here is reading a
      # guarantee rather than guessing at prose.
      - name: Build release notes
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --latest --strip all > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "No user-facing changes since the previous release." > NOTES.md
          fi
          echo "--- release notes ---"
          cat NOTES.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "dogtag $TAG" \
            --notes-file NOTES.md \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            dist/*.cdx.json dist/*.cdx.json.sha256 dist/sha256.sum
